name: Sheng 3OS Seed Generation (8 GiB + 10 GiB)
run-name: Sheng 3OS / 8 GiB + 10 GiB iPadOS 24A446 Data seeds
on:
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: sheng-3os-seed
  cancel-in-progress: false
jobs:
  generate-3os-apfs-seeds:
    runs-on: macos-26
    timeout-minutes: 120
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      FRAMEWORK_COMMIT: 97437dcf7389484a0eeaa8067725ce743aff18ef
      DARWINBOOT_COMMIT: 5243c68ec332a227fe3680cd5da6d5a0e127035c
    steps:
      - name: Check ref
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/codex/3os-seed-8g-10g
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Check runner architecture and disk space
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          echo "ImageVersion=${ImageVersion:-missing} sw_vers=$(sw_vers -buildVersion)"
          df -h
      - name: Free disk space for OS disk image
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /Applications/Xcode_16*.app /Applications/Xcode_15*.app /Users/runner/Library/Developer/CoreSimulator /Library/Developer/CoreSimulator /usr/local/lib/android || true
          df -h
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: UniXNU/UniXNU
          ref: 97437dcf7389484a0eeaa8067725ce743aff18ef
          path: _unixnu
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: UniXNU/DarwinBoot
          ref: 5243c68ec332a227fe3680cd5da6d5a0e127035c
          path: _unixnu/drivers/DarwinBoot
          persist-credentials: false
      - name: Install ipsw and cryptography
        shell: bash
        run: |
          set -euo pipefail
          brew install blacktop/tap/ipsw
          ipsw version
          python3 -m pip install --break-system-packages cryptography || python3 -m pip install cryptography
      - name: Generate, verify, and encrypt 8 GiB + 10 GiB APFS Data seeds
        env:
          UNIXNU_SHENG_SEED_KEY_3OS: ${{ secrets.UNIXNU_SHENG_SEED_KEY_3OS }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/stage0c3/make_encrypted_seed.py \
            --unixnu "$GITHUB_WORKSPACE/_unixnu" \
            --work "$RUNNER_TEMP/seed-work" \
            --out "$RUNNER_TEMP/seed-out" \
            --gibs 8,10
      - name: Upload encrypted seeds and receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sheng-3os-seed-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/seed-out/data-8g.dbr.enc
            ${{ runner.temp }}/seed-out/data-10g.dbr.enc
            ${{ runner.temp }}/seed-out/seed-receipt-3os.json
          retention-days: 7
          if-no-files-found: error
