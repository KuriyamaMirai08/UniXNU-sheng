name: Prebuild audit (no full package)
on:
  pull_request:
    paths:
      - '.github/workflows/prebuild-audit.yml'
      - 'scripts/audit-cached-prelink.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cached-prelink:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: device
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: 97437dcf7389484a0eeaa8067725ce743aff18ef
          path: UniXNU
      - run: git -C UniXNU submodule update --init --depth 1 kits/XnuPrelink
      - uses: actions/cache/restore@v4
        with:
          path: |
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/tree/build/m2v-target
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/tree/build/mesa-tu-ios27
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/tree/build/xnu/fileset-reference
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/tree/build/xnu/ios-obj
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/tree/.cache/appsync-signer
            device/.cache/firmware/sheng
          key: unixnu-heavy-build-27-59fd891211ff79ab5047f9d19a80d95e6a3b29a7
          fail-on-cache-miss: true
      - name: Diagnose later prelink stages without compiling or accessing Data
        run: >-
          python3 device/scripts/audit-cached-prelink.py --unixnu UniXNU
          --cache-tree UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/tree
          --output audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-prelink-reports
          path: |
            audit/*.json
            audit/*.log
          retention-days: 7
  edk2-and-image-tests:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: device
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: 97437dcf7389484a0eeaa8067725ce743aff18ef
          path: UniXNU
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/uefi-sheng
          ref: 66421cb7bb5694843aec8de1ca3d1de4c20cca38
          path: uefi-sheng
      - name: Prepare only EDK II package dependencies
        run: |
          git -C uefi-sheng submodule update --init --depth 1 Mu_Basecore
          git -C uefi-sheng/Mu_Basecore submodule update --init --depth 1 MdePkg/Library/BaseFdtLib/libfdt MdePkg/Library/MipiSysTLib/mipisyst BaseTools/Source/C/BrotliCompress/brotli
          git -C uefi-sheng/Mu_Basecore apply --check ../Resources/MuPatches/Gic-Spurious.patch
          brew install llvm lld cmake dtc mtools
          echo /opt/homebrew/opt/llvm/bin >> "$GITHUB_PATH"
          echo /opt/homebrew/opt/lld/bin >> "$GITHUB_PATH"
      - name: Compile standalone UniXNU EDK II package
        run: |
          mkdir -p audit-edk
          export UNIXNU_EDK2="$PWD/uefi-sheng/Mu_Basecore"
          export UNIXNU_BUILD_DIR="$PWD/audit-edk/package"
          export CLANG_BIN=$(python3 -c 'import sys; from pathlib import Path; sys.path.insert(0,"UniXNU/scripts"); from unixnu.util import clang_bin; print(clang_bin(Path("audit-edk/toolchain").resolve()))')
          bash UniXNU/package/build.sh > audit-edk/package.log 2>&1
      - name: Exercise existing pipeline and image host tests
        working-directory: UniXNU
        run: python3 -m unittest discover -s scripts/unixnu -t scripts -p 'test_*.py' > ../audit-edk/host-tests.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-edk-reports
          path: audit-edk/*.log
          retention-days: 7
