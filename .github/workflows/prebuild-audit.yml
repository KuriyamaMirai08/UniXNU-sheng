name: Clean kernel reproducibility B1
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: unixnu-clean-kernel-b1
  cancel-in-progress: false
jobs:
  current:
    runs-on: macos-26
    timeout-minutes: 350
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install and record tools
        shell: bash
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR"
          brew install dtc llvm lld cmake mtools ninja glslang shaderc spirv-tools bison pkgconf rustup blacktop/tap/ipsw
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo /opt/homebrew/opt/llvm/bin >> "$GITHUB_PATH"
          echo /opt/homebrew/opt/lld/bin >> "$GITHUB_PATH"
          echo /opt/homebrew/opt/bison/bin >> "$GITHUB_PATH"
          rustup toolchain install 1.98.0 --profile minimal --component rust-src
      - name: Isolated source build with failure preservation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 -B scripts/repro/test_paths.py -v
          python3 scripts/repro/run.py
      - name: Archive complete attempt without Git databases
        if: always() && env.REPRO_ATTEMPT != ''
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/repro-upload"
          tar --exclude=.git -czf "$RUNNER_TEMP/repro-upload/attempt.tar.gz" -C "$REPRO_ATTEMPT" .
          shasum -a 256 "$RUNNER_TEMP/repro-upload/attempt.tar.gz" > "$RUNNER_TEMP/repro-upload/SHA256SUMS.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && env.REPRO_ATTEMPT != ''
        with:
          name: clean-kernel-b1-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/repro-upload/
          if-no-files-found: error
          retention-days: 1
