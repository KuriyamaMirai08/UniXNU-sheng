name: package
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/cache/restore@v4
        with:
          path: |
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/tree/build/m2v-target
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/tree/build/mesa-tu-ios27
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/tree/build/xnu/fileset-reference
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/tree/build/xnu/ios-obj
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/tree/.cache/appsync-signer
            device/.cache/firmware/sheng
          key: unixnu-heavy-build-27-59fd891211ff79ab5047f9d19a80d95e6a3b29a7
          fail-on-cache-miss: true
      - name: Inspect cached native executable
        run: |
          kernel=UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/tree/build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf
          xcrun nm -u "$kernel"
          mkdir diagnostic
          cp "$kernel" diagnostic/
      - uses: actions/upload-artifact@v4
        with:
          name: package29-native-diagnostic
          retention-days: 1
          path: diagnostic/
