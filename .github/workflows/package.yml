name: package

# scripts/package.sh of this repository on a macOS runner, with the UniXNU and uefi-sheng
# checkouts beside it, the layout board.toml names. The platform seed comes from the
# repository secret UNIXNU_UNIQUE_CHIP_ID and is baked into the images, so the run's
# artifacts belong to one device alone: download them, then delete the run.

on:
  workflow_dispatch:
    inputs:
      runner_location:
        description: "UniXNU-M4: persistent official release without installation credentials; hosted: GitHub macOS"
        type: choice
        options: [UniXNU-M4, hosted]
        default: UniXNU-M4
      os:
        description: "OS profile of the images"
        type: choice
        options: ["27", "26", "17"]
        default: "27"
      init_data:
        description: "Create a NEW installation seed if no saved seed exists (iPadOS 27 only)"
        type: boolean
        default: false
      data_seed_url:
        description: "Optional original data.dbr URL for an existing installation; otherwise use the saved cache"
        type: string
      data_seed_sha256:
        description: "Required SHA-256 when data_seed_url is supplied"
        type: string

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}-${{ inputs.runner_location || 'hosted' }}
  cancel-in-progress: ${{ inputs.runner_location != 'UniXNU-M4' }}

jobs:
  m4-package:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.runner_location == 'UniXNU-M4' &&
      !inputs.init_data && inputs.data_seed_url == '' && inputs.data_seed_sha256 == ''
    permissions: {}
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 360
    concurrency:
      group: unixnu-m4-public-xnu
      cancel-in-progress: false
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Prepare persistent public checkout on UniXNU-M4
        env:
          ACTUAL_RUNNER: ${{ runner.name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$ACTUAL_RUNNER" = UniXNU-M4
          test "$(uname -m)" = arm64
          root="$HOME/Library/Caches/UniXNU-sheng/public-xnu-v1"
          mkdir -p "$root/logs/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "M4_ROOT=$root" >> "$GITHUB_ENV"
          echo "M4_LOG_DIR=$root/logs/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          exec > >(tee -a "$root/logs/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/checkout.log") 2>&1
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=credential.helper GIT_CONFIG_VALUE_0=
          device="$root/device"
          if [ ! -d "$device/.git" ]; then
            git clone --no-checkout --filter=blob:none https://github.com/KuriyamaMirai08/UniXNU-sheng.git "$device"
          else
            /opt/homebrew/opt/python@3.13/libexec/bin/python3 - "$device" <<'PY'
          import importlib.util, pathlib, subprocess, sys
          device = pathlib.Path(sys.argv[1])
          spec = importlib.util.spec_from_file_location('ci', device / 'scripts/prepare-package-ci.py')
          ci = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(ci)
          def git(repo, *argv):
              return subprocess.check_output(['git', '-C', str(repo), *argv], text=True).strip()
          repos = git(device, 'submodule', 'foreach', '--quiet', '--recursive', 'pwd').splitlines()
          for repo in map(pathlib.Path, repos):
              dirty = git(repo, 'diff', '--name-only', '--ignore-submodules=dirty', 'HEAD', '--').splitlines()
              if not dirty:
                  continue
              if (repo.resolve() != (device / 'drivers/Ath12kWifi').resolve()
                      or dirty != ['tools/fetch-sources.py'] or git(repo, 'rev-parse', 'HEAD') != ci.ATH12K):
                  raise SystemExit('Unreviewed source edits retained: ' + str(repo))
              original = git(repo, 'show', 'HEAD:tools/fetch-sources.py') + '\n'
              if (repo / dirty[0]).read_text() != ci.transform(original):
                  raise SystemExit('Unreviewed Ath12k edit retained')
          PY
            git -C "$device" diff --exit-code --ignore-submodules=dirty HEAD --
          fi
          git -C "$device" fetch --depth 1 origin "$SOURCE_SHA"
          git -C "$device" checkout --detach "$SOURCE_SHA"
          git -C "$device" submodule update --init --recursive
          for entry in \
            'UniXNU 97437dcf7389484a0eeaa8067725ce743aff18ef UniXNU/UniXNU' \
            'uefi-sheng 66421cb7bb5694843aec8de1ca3d1de4c20cca38 UniXNU/uefi-sheng'; do
            read -r name revision repository <<< "$entry"
            if [ ! -d "$root/$name/.git" ]; then
              git clone --no-checkout --filter=blob:none "https://github.com/$repository.git" "$root/$name"
              git -C "$root/$name" fetch --depth 1 origin "$revision"
              git -C "$root/$name" checkout --detach FETCH_HEAD
            fi
            test "$(git -C "$root/$name" rev-parse HEAD)" = "$revision" || {
              echo "Source pin mismatch in $name; preserved checkout and output require review"; exit 1;
            }
          done
      - name: Official dependency preparation, kernel build and prelink
        env:
          OS_PROFILE: ${{ inputs.os }}
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/opt/python@3.13/libexec/bin:/opt/homebrew/bin:/opt/homebrew/opt/bison/bin:$HOME/.cargo/bin:$PATH"
          exec > >(tee -a "$M4_LOG_DIR/console.log") 2>&1
          cd "$M4_ROOT/device"
          # Normalize only the exact known standalone-stage bootstrap mode.
          # Keep the proven cache-aware CoreCrypto builder and transport retry;
          # reject other source changes instead of resetting a build directory.
          python3 - "$M4_ROOT" <<'PY'
          import hashlib, importlib.util, pathlib, subprocess, sys
          root = pathlib.Path(sys.argv[1])
          def module(name, path):
              spec = importlib.util.spec_from_file_location(name, path)
              value = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(value)
              return value
          ci = module('ci', root / 'device/scripts/prepare-package-ci.py')
          crypto = module('crypto_cache', root / 'device/scripts/prepare-corecrypto-cache.py')
          upstream = root / 'UniXNU'
          dirty = set(subprocess.check_output(['git', '-C', str(upstream), 'diff', '--name-only', '--ignore-submodules=dirty', 'HEAD', '--'], text=True).splitlines())
          if dirty - {'scripts/unixnu/kernel.py', 'scripts/build-corecrypto-14.py', 'scripts/fetch-adreno-inputs.py'}:
              raise SystemExit('Unreviewed upstream source edits retained: ' + repr(sorted(dirty)))
          def original(path):
              return subprocess.check_output(['git', '-C', str(upstream), 'show', 'HEAD:' + path], text=True)
          kernel = upstream / 'scripts/unixnu/kernel.py'
          source = original('scripts/unixnu/kernel.py')
          fixed = ci.transform_kernel_bootstrap(source)
          staged = fixed.replace('if not record.is_file() or missing_headers:',
                                 "if not record.is_file() or missing_headers or env.get('UNIXNU_XNU_COMPILE_STAGE') == '1':")
          if kernel.read_text() not in (source, fixed, staged):
              raise SystemExit('Unreviewed kernel builder edits retained')
          if kernel.read_text() == staged:
              kernel.write_text(fixed)
          source = original('scripts/build-corecrypto-14.py')
          if (upstream / 'scripts/build-corecrypto-14.py').read_text() not in (source, crypto.transform(source)):
              raise SystemExit('Unreviewed CoreCrypto builder edits retained')
          gpu = upstream / 'scripts/fetch-adreno-inputs.py'
          if hashlib.sha256(gpu.read_bytes()).hexdigest() not in (
                  'a854723a3a5530811aa628172b09096def25b6f319609b5f35dc29fe54b2fa15',
                  '3e8b7aec9d8bb591839428b320f3e9fd25fc75ec56d2addb0a93f9b38efd6657'):
              raise SystemExit('Unreviewed GPU fetcher edits retained')
          fixture = upstream / 'kits/XnuPrelink/fixtures/fileset-24A446-sheng-m4-symbols.json'
          if fixture.exists():
              if fixture.read_bytes() != (root / 'device/scripts/m4-prelink-symbols.json').read_bytes():
                  raise SystemExit('Unreviewed experimental prelink fixture retained')
              retired = root / 'retired-stage-overrides'
              retired.mkdir(exist_ok=True)
              fixture.rename(retired / ('prelink-' + hashlib.sha256(fixture.read_bytes()).hexdigest() + '.json'))
          if any((root / 'out/sheng').glob('*/*/runtime/data.dbr')):
              raise SystemExit('Installation seed already present; public rental-Mac execution is not authorized to read it')
          for base in (root / 'device', upstream):
              if (base / 'local.toml').exists():
                  raise SystemExit('Local source overrides require review before public rental-Mac execution')
          (root / 'public-build.toml').write_text('[build]\n')
          PY
          # Same existing hosted compatibility fix; no replacement release driver.
          python3 scripts/prepare-package-ci.py --unixnu "$M4_ROOT/UniXNU"
          # Do not inherit identity/Seed/PAT variables or an ignored private
          # unixnu.local.toml. No --init-data, --skip-prelink or policy overrides.
          env -i HOME="$HOME" USER="${USER:-a105}" LOGNAME="${LOGNAME:-a105}" \
            PATH="$PATH" TMPDIR="${TMPDIR:-/tmp}" LANG=en_US.UTF-8 \
            DEVELOPER_DIR="$DEVELOPER_DIR" UNIXNU_ROOT="$M4_ROOT/UniXNU" \
            UNIXNU_DEVICE="$M4_ROOT/device" PYTHONUNBUFFERED=1 \
            M4_ROOT="$M4_ROOT" OS_PROFILE="$OS_PROFILE" \
            GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=credential.helper GIT_CONFIG_VALUE_0= \
            bash -euo pipefail -c '
              args=(--os "$OS_PROFILE" --uefi "$M4_ROOT/uefi-sheng"
                    --out "$M4_ROOT/out" --config "$M4_ROOT/public-build.toml" -j 4)
              # Existing official commands: source deps, config/patch preflight,
              # then the real kernel builder and its unchanged prelink checks.
              python3 "$M4_ROOT/UniXNU/unixnu" fetch "${args[@]}"
              bash scripts/package.sh "${args[@]}" --no-deps --check
              python3 "$M4_ROOT/UniXNU/unixnu" build kernel "${args[@]}"
              echo "Official kernel build/prelink completed. Stopping before runtime/payload/boot packaging; installation inputs require separate authorization."
            '
      - name: Retain public release logs after success or failure
        if: always() && env.M4_LOG_DIR != ''
        run: |
          mkdir -p "$M4_LOG_DIR"
          if compgen -G "$M4_ROOT/out/sheng/*/*/runtime/data.dbr" >/dev/null; then
            exit 0  # Do not copy logs from a pre-existing private installation.
          fi
          for source in "$M4_ROOT"/out/sheng/*/*/logs; do
            if [ -d "$source" ]; then
              profile="$(basename "$(dirname "$(dirname "$source")")")"
              config="$(basename "$(dirname "$source")")"
              cp -R "$source" "$M4_LOG_DIR/$profile-$config"
            fi
          done
      - name: Downloadable public build logs
        if: always() && env.M4_LOG_DIR != ''
        uses: actions/upload-artifact@v4
        with:
          name: m4-release-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.M4_LOG_DIR }}/
          retention-days: 14
          if-no-files-found: warn

  reject-unsafe-m4-inputs:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.runner_location == 'UniXNU-M4' &&
      (inputs.init_data || inputs.data_seed_url != '' || inputs.data_seed_sha256 != '')
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: echo 'UniXNU-M4 requires init_data=false and empty seed URL/SHA. No job was sent to the rental Mac.'; exit 1

  package:
    # All secret/seed/cache/image steps stay inside this hosted-only job.
    if: github.event_name == 'workflow_dispatch' && (inputs.runner_location == 'hosted' || inputs.runner_location == '')
    runs-on: macos-26
    timeout-minutes: 360
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          path: device
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: 97437dcf7389484a0eeaa8067725ce743aff18ef
          path: UniXNU
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/uefi-sheng
          ref: 66421cb7bb5694843aec8de1ca3d1de4c20cca38
          path: uefi-sheng
          submodules: recursive
      - name: tools
        run: |
          test -d "$DEVELOPER_DIR"
          xcrun clang --version
          xcrun --sdk iphoneos --show-sdk-version
          brew install dtc llvm lld cmake mtools ninja glslang shaderc spirv-tools bison pkgconf rustup blacktop/tap/ipsw
          {
            echo "$HOME/.cargo/bin"
            echo "/opt/homebrew/opt/llvm/bin"
            echo "/opt/homebrew/opt/lld/bin"
            echo "/opt/homebrew/opt/bison/bin"
          } >> "$GITHUB_PATH"
          rustup toolchain install 1.98.0 --profile minimal --component rust-src
          ok=1
          for t in clang xcodebuild make git ninja cmake dtc fdtget fdtput aea compression_tool \
                   mformat mcopy ipsw; do
            command -v "$t" >/dev/null || { echo "missing tool: $t"; ok=0; }
          done
          for t in lld-link llvm-lib llvm-rc llvm-nm llvm-objcopy; do
            [ -f "/opt/homebrew/opt/llvm/bin/$t" ] || [ -f "/opt/homebrew/opt/lld/bin/$t" ] || { echo "missing tool: $t"; ok=0; }
          done
          [ "$ok" = 1 ]
      - name: platform seed
        env:
          seed: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          if ! [[ "$seed" =~ ^[0-9a-fA-F]{8}$ ]]; then
            echo 'Set the repository secret UNIXNU_UNIQUE_CHIP_ID: the platform seed of the device, 8 hex digits.' >&2
            exit 1
          fi
      - name: seed cache identity
        id: seed-key
        env:
          SEED: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          python3 - <<'PY'
          import hashlib, os
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('key=data-seed-v1-' + hashlib.sha256(os.environ['SEED'].encode()).hexdigest()[:16] + '\n')
          PY
      - uses: actions/cache/restore@v4
        id: data-cache
        if: inputs.os == '27'
        with:
          path: |
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/inputs.json
          key: ${{ steps.seed-key.outputs.key }}-${{ inputs.os }}
      - uses: actions/cache/restore@v4
        id: build-cache
        with:
          path: |
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/tree/build/m2v-target
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/tree/build/mesa-tu-ios27
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/tree/build/xnu/fileset-reference
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/tree/build/xnu/ios-obj
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/tree/.cache/fakeroot
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/tree/.cache/appsync-signer
            device/.cache/firmware/sheng
          key: unixnu-heavy-build-${{ inputs.os }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            unixnu-heavy-build-${{ inputs.os }}-${{ github.sha }}-
            unixnu-heavy-build-${{ inputs.os }}-
      - name: prepare preserved Data seed
        if: inputs.os == '27'
        env:
          INIT_DATA: ${{ inputs.init_data }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, urllib.request
          inputs = json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())['inputs']
          path = pathlib.Path('UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr')
          url, digest = inputs.get('data_seed_url', ''), inputs.get('data_seed_sha256', '').lower()
          if url:
              print('::add-mask::' + url)
              if not url.startswith('https://') or len(digest) != 64 or any(c not in '0123456789abcdef' for c in digest):
                  raise SystemExit('A seed URL requires HTTPS and its SHA-256')
              with urllib.request.urlopen(url, timeout=120) as source:
                  data = source.read(64 * 1024 * 1024 + 1)
              if len(data) > 64 * 1024 * 1024 or hashlib.sha256(data).hexdigest() != digest:
                  raise SystemExit('Seed size or SHA-256 mismatch')
              if path.exists() and path.read_bytes() != data:
                  raise SystemExit('Saved seed differs; preserve and inspect it instead of replacing this installation')
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
          if not path.is_file() and os.environ['INIT_DATA'] != 'true':
              raise SystemExit('No saved seed. Supply the ORIGINAL seed for an existing installation, or select init_data for a FIRST installation')
          PY
      # Verify/extract the large stock ROM before a long kernel build. The tree's
      # .cache/firmware is linked to this same device cache by unixnu tree.
      - name: Stage verified sheng UEFI inputs early
        working-directory: device
        env:
          UNIXNU_DEVICE: ${{ github.workspace }}/device
          UNIXNU_UEFI: ${{ github.workspace }}/uefi-sheng
        run: |
          python3 scripts/download-sheng-firmware.py --connections 16
          python3 scripts/extract-sheng-firmware.py --delete-archive
          python3 scripts/import-sheng-uefi.py
      - name: package
        working-directory: device
        env:
          UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          INIT_DATA: ${{ inputs.init_data }}
          OS_PROFILE: ${{ inputs.os }}
        run: |
          args=(--os "$OS_PROFILE" --uefi ../uefi-sheng)
          if [ "$OS_PROFILE" = 27 ] && [ "$INIT_DATA" = "true" ]; then
            args+=(--init-data)
          fi

          python3 scripts/prepare-package-ci.py --unixnu ../UniXNU

          echo "=== [2/4] 预拉取键盘与触控专有固件 (MCU_Upgrade.bin 等) ==="
          python3 scripts/extract-files.py

          echo "=== [3/4] 预拉取 Ath12k Wi-Fi 依赖源码 (Linux / FreeBSD / wpa_supplicant) ==="
          bash drivers/Ath12kWifi/tools/fetch-sources.sh

          echo "=== [4/4] 预拉取 QcaBluetooth 源码与蓝牙固件 ==="
          python3 drivers/QcaBluetooth/tools/prepare-linux.py
          python3 scripts/stage-bluetooth-firmware.py .cache/bt-stage --fetch

          scripts/package.sh "${args[@]}"
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/tree/build/m2v-target
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/tree/build/mesa-tu-ios27
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/tree/build/xnu/fileset-reference
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/tree/build/xnu/ios-obj
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/tree/.cache/fakeroot
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/tree/.cache/appsync-signer
            device/.cache/firmware/sheng
          key: unixnu-heavy-build-${{ inputs.os }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/cache/save@v4
        if: always() && inputs.os == '27' && steps.data-cache.outputs.cache-hit != 'true' && hashFiles('UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr') != ''
        with:
          path: |
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/inputs.json
          key: ${{ steps.seed-key.outputs.key }}-${{ inputs.os }}
      - name: installation seed backup
        if: always() && inputs.os == '27' && hashFiles('UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr') != ''
        uses: actions/upload-artifact@v4
        with:
          name: installation-seed-${{ inputs.os }}
          retention-days: 1
          path: |
            UniXNU/out/sheng/*/*/runtime/data.dbr
            UniXNU/out/sheng/*/*/runtime/inputs.json
      - name: build logs backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ inputs.os }}
          retention-days: 1
          path: UniXNU/out/sheng/*/*/logs/
      - name: images
        uses: actions/upload-artifact@v4
        with:
          name: images-${{ inputs.os }}
          retention-days: 1
          if-no-files-found: error
          path: |
            UniXNU/out/sheng/*/*/boot/boot.img
            UniXNU/out/sheng/*/*/payload/payload.img
            UniXNU/out/sheng/*/*/kernel/kernel.macho
            UniXNU/out/sheng/*/*/package.manifest.json
